services:
  qdrant:
    image: "qdrant/qdrant:latest"
    container_name: "qdrant"
    ports:
      - "6333:6333" #support HTTP protocol
      - "6334:6334" #support gRPC protocol
  prometheus:
    image: "prom/prometheus"
    container_name: "prometheus"
    volumes:
      - "./prometheus-config.yml:/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"
    networks:
      - spring-AI
  grafana:
    image: "grafana/grafana"
    container_name: "grafana"
    ports:
      - "3000:3000"
    volumes:
      - "./grafana-storage:/var/lib/grafana"
    networks:
      - spring-AI
  jaeger:
    image: "jaegertracing/all-in-one:latest"
    container_name: "jaeger"
    ports:
      - "16686:16686" #to access UI jaeger
      - "4317:4317" #to accept tracing data by using gRPC protocol
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - spring-AI

networks:
  spring-AI:
    driver: bridge